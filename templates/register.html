<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MIC Event Check-In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <div class="card">
            <h1>Create Account</h1>
            <p class="subtitle">Join the MIC Event Check-In System</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flashes">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('register') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" value="{{ name or '' }}" required placeholder="e.g. Alex Johnson" autofocus>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="e.g. alex@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Choose a secure password">
                </div>

                <div class="form-group">
                    <label for="role">Account Role</label>
                    <select id="role" name="role" required>
                        <option value="" disabled {% if not role %}selected{% endif %}>Select your role</option>
                        <option value="attendee" {% if role == 'attendee' %}selected{% endif %}>Attendee (Event Participant)</option>
                        <option value="organizer" {% if role == 'organizer' %}selected{% endif %}>Organizer (Event Manager)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>

            <div class="card-footer">
                <p>Already have an account? <a href="{{ url_for('login') }}">Log In</a></p>
                <p><a href="{{ url_for('index') }}" class="back-link">&larr; Back to Home</a></p>
            </div>
        </div>
    </main>
</body>
</html>
